# ========================================
# APPEARANCE
# ========================================
font_family JetBrainsMono Nerd Font Mono
font_size 10.0
cursor_shape block
cursor_blink_interval 0
window_padding_width 0
background_opacity 1.0
dynamic_background_opacity no
wm_class kitty

# ========================================
# TABS
# ========================================
# Close tabs instantly, no confirmation dialog
window_close_confirmation close
show_tab_bar always
tab_bar_style custom
tab_bar_edge bottom
tab_bar_template "{tabs}{fmt.bg.tab_bar}{fmt.fg.active_tab}  <action:new_tab>  +  </action>  "
active_tab_title_template "{fmt.bg.active_tab}{fmt.fg.active_tab}  {title}  "
tab_title_template "{fmt.bg.inactive_tab}{fmt.fg.inactive_tab}  {title}  {fmt.fg.inactive_tab}│"

map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6

# ========================================
# KEY MAPPINGS (Signal Remap)
# ========================================
# ctrl+z now handled by opencode for undo (pass through)
# ctrl+shift+z handled by opencode for terminal_suspend (pass through)

# Paste with ctrl+v (like most terminals)
map ctrl+v paste_from_clipboard
map ctrl+shift+v paste_from_selection

# ========================================
# MOUSE
# ========================================
copy_on_select clipboard
mouse_map right press ungrabbed noop
mouse_map right release ungrabbed paste_from_clipboard

# ========================================
# SCROLLING & NAVIGATION
# ========================================
wheel_scroll_multiplier 5.0
inactive_text_alpha 0.8

# Quick scroll with keyboard
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down
map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end scroll_end

# ========================================
# FONT SIZE (handy for demos / readability)
# ========================================
map ctrl+plus font_size +2
map ctrl+equal font_size +2
map ctrl+minus font_size -2
map ctrl+0 font_size 10

# ========================================
# PERFORMANCE
# ========================================
sync_to_monitor yes
remember_window_size yes
initial_window_width 800
initial_window_height 600

# ========================================
# THEME
# ========================================
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Send ^W (unix-word-rubout) on Ctrl+Backspace for backward word deletion
map ctrl+backspace send_text all \x17
